[project]
name = "boilerplate-temporal"
version = "0.0.1"
description = "Temporal worker stub for boilerplate stack"
requires-python = ">=3.11"
dependencies = [
  "temporalio==1.5.0",
  "pydantic==2.7.3",
  "pydantic-settings==2.4.0",
  "pyyaml>=6.0",
  "anthropic==1.4.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "numpy>=1.26",
  "scipy>=1.11"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-json-report"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `src` importable however pytest is invoked (CI runs it from the repo root).
pythonpath = ["."]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
